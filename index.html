<head>

<style>
:root{--bg:#0A0A0C;--surface:#141419;--elev:#1B1B22;--gold:#D4AF37;--champ:#E8D8A6;--deep:#B8963E;--text:#F5F1E8;--dim:#9C968B;--hair:rgba(212,175,55,.14);--danger:#7A1F2B;--ease:cubic-bezier(.22,.61,.36,1);--bs:56px;--bo:.12;--f:'Inter','Tajawal',system-ui,sans-serif}
html[lang=ar]{--f:'Tajawal','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font:500 15px/1.55 var(--f);overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1em;height:1em;display:block}
.serif{font-family:'Cormorant Garamond',serif;font-weight:600}
.gt{background:linear-gradient(135deg,var(--champ),var(--gold) 55%,var(--deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.dim{color:var(--dim);font-size:13px}
.grow{flex:1;min-width:0}
h1{font-weight:800;font-size:30px}h2{font-weight:700;font-size:20px;margin-bottom:6px}
.sec{font-weight:700;font-size:14px;color:var(--champ);margin:22px 0 10px}
/* الشاشات */
.scr{display:none;position:fixed;inset:0;overflow-y:auto;padding:max(24px,env(safe-area-inset-top)) 24px 120px}
.scr.on{display:block;animation:fi .35s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.card{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.card::before{content:"";position:absolute;top:0;inset-inline:24px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.flex{display:flex;align-items:center;gap:14px}
.empty{text-align:center;color:var(--dim)}.empty svg{font-size:34px;margin:0 auto 8px;color:var(--deep);opacity:.7}
.orb{width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:24px;flex:none;background:rgba(212,175,55,.06)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--hair);display:grid;place-items:center;color:var(--gold);font-size:20px;transition:.3s var(--ease)}
.ib:active{background:rgba(212,175,55,.14);transform:scale(.98)}
.btn{height:52px;border-radius:14px;padding:0 22px;font-weight:700;font-size:16px;transition:transform .3s var(--ease),background .3s var(--ease);width:100%}
.btn:active{transform:scale(.98)}
.pri{background:linear-gradient(135deg,var(--champ),var(--gold) 55%,var(--deep));color:#1a1405}
.gh{border:1px solid var(--hair);background:transparent}.gh:active{background:rgba(212,175,55,.14)}
.two{display:flex;gap:12px;margin-top:18px}
/* مفتاح */
.sw{width:50px;height:28px;border-radius:14px;border:1px solid var(--hair);background:var(--elev);position:relative;flex:none;transition:.3s var(--ease)}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:inset-inline-start .3s var(--ease),background .3s}
.sw.on{border-color:var(--gold);background:rgba(212,175,55,.16)}.sw.on i{inset-inline-start:25px;background:var(--gold)}
/* تبويبات */
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;height:42px;border-radius:21px;border:1px solid var(--hair);color:var(--dim);transition:.3s var(--ease)}
.tab.on{border-color:var(--gold);color:var(--champ);background:rgba(212,175,55,.1)}
.ap{display:flex;align-items:center;gap:14px;padding:16px 20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none}
.ap b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* صفوف وشبكات */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;width:100%;text-align:start;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.chip{min-height:48px;padding:8px;border:1px solid var(--hair);border-radius:14px;background:var(--elev);font-size:13px;text-align:center;position:relative;transition:.3s var(--ease)}
.chip:active{transform:scale(.98);background:rgba(212,175,55,.12)}
.chip.sel{border-color:var(--gold);color:var(--champ);box-shadow:0 0 14px rgba(212,175,55,.18)}
.chip s{position:absolute;top:2px;inset-inline-end:6px;text-decoration:none;color:var(--dim);font-size:15px}
.lbl{display:flex;justify-content:space-between;margin:6px 0 10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--hair);margin:8px 0 18px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.6)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.6)}
.pvbox{height:84px;border-radius:14px;background:var(--bg);border:1px dashed var(--hair);display:grid;place-items:center;margin-bottom:6px}
.bub{width:var(--bs);height:var(--bs);border-radius:50%;border:1px solid var(--gold);background:rgba(212,175,55,.08);color:var(--gold);display:grid;place-items:center;font-size:calc(var(--bs)*.42);opacity:var(--bo)}
.in{width:100%;height:50px;border-radius:14px;border:1px solid var(--hair);background:var(--elev);color:var(--text);padding:0 14px;font:inherit;margin:6px 0 14px;color-scheme:dark}
.in:focus{outline:0;border-color:var(--gold)}
.step .ck{color:var(--gold);font-size:20px;min-width:22px}
/* التنقل */
#nav{position:fixed;bottom:0;inset-inline:0;z-index:50;display:flex;background:rgba(10,10,12,.92);backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);font-size:11px;padding:4px;transition:.3s var(--ease)}
#nav button svg{font-size:23px}#nav button.on{color:var(--gold)}
/* الفقاعة */
#bubble{position:fixed;z-index:60;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:opacity .3s var(--ease)}
#bubble.snap{transition:left .25s var(--ease),top .25s var(--ease),opacity .3s}
#bubble.press,#bubble.listening,#bubble.processing,#bubble.success{opacity:.6}
#bubble.listening{animation:ring 1.4s infinite}
#bubble.processing{border-style:dashed}
#bubble.success{box-shadow:0 0 18px var(--gold)}
#bubble.upcoming{box-shadow:0 0 12px rgba(212,175,55,.5)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(212,175,55,.55)}100%{box-shadow:0 0 0 20px rgba(212,175,55,0)}}
/* النوافذ */
.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);display:none;align-items:flex-end}
.ov.on{display:flex;animation:fo .3s var(--ease)}
@keyframes fo{from{opacity:0}}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-top:1px solid var(--gold);border-radius:24px 24px 0 0;padding:28px 24px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .4s var(--ease)}
#confirm .sheet{text-align:start}
@keyframes up{from{transform:translateY(60px)}}
.orbL{width:120px;height:120px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:48px;color:var(--gold);margin:0 auto 18px;background:rgba(212,175,55,.06)}
.orbL.pls{animation:ring 1.4s infinite}
.tx{min-height:64px;margin-top:14px;padding:12px;border-radius:14px;background:var(--elev);color:var(--champ);font-size:16px}
/* المنبه */
#alarm{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;background:radial-gradient(circle at 50% 35%,#1d1a10,var(--bg) 70%)}
#alarm.on{display:flex}
.pulse{width:180px;height:180px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:72px;color:var(--gold);animation:pul 2.4s var(--ease) infinite;margin-bottom:30px}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.35);transform:scale(1)}50%{box-shadow:0 0 50px 16px rgba(212,175,55,.18);transform:scale(1.04)}}
.ls{letter-spacing:4px;color:var(--dim)}
#aT{font-size:34px;margin:10px 0}#aTm{font-size:56px;line-height:1.1}
#alarm .two{width:100%;max-width:380px;margin-top:40px}
/* إشعار + افتتاحية */
#toast{position:fixed;z-index:90;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,16px);max-width:88%;background:var(--elev);border:1px solid var(--gold);border-radius:14px;padding:12px 18px;opacity:0;pointer-events:none;transition:.35s var(--ease);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s var(--ease)}
#splash.out{opacity:0;pointer-events:none}
.ring{width:96px;height:96px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font-size:54px;line-height:1}
.nm{font-size:34px;letter-spacing:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <h3 class="sec" data-i="beh"></h3>

  <h3 class="sec" data-i="lng"></h3>

</div></div>

  <div class="two"><button class="btn gh" id="aSn"></button><button class="btn pri" id="aDn" data-i="dn"></button></div></div>

<script>

let ctx=null;
function audioCtx(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}return ctx}
function env(f,t0,d,v,f2,a){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.linearRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(ctx.destination);o.start(t0);o.stop(t0+d+.05)}
const TONES={
  whisper:n=>env(440,n,2.8,.22,0,.4),
  beep:n=>{env(880,n,.12,.3,0,.01);env(880,n+.15,.12,.3,0,.01)},
  chime:n=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>env(f,n+i*.28,1.3,.25,0,.02)),

function buildToneGrid(){$('#tones').innerHTML=TONE_IDS.map((id,i)=>`<button class="chip ${state.tone===id?'sel':''}" data-tone="${id}">${esc(t('tns')[i])}</button>`).join('')}

function buildLangGrid(){$('#langs').innerHTML=Object.keys(LANGS).map(k=>`<button class="chip ${state.lang===k?'sel':''}" data-lang="${k}" style="font-family:inherit">${LANGS[k].n}</button>`).join('')}
function importMusic(f){if(!f)return;if(f.size>5*1024*1024){toast(t('big'));return}
  const r=new FileReader();r.onload=()=>{const c={id:'cu_'+Date.now(),name:f.name.replace(/\.[^.]+$/,'').slice(0,14)||t('mus'),url:r.result};state.custom.push(c);
    if(!saveState()){state.custom.pop();return}state.tone=c.id;saveState();buildToneGrid();buildCustomTones();toast(t('imp'))};r.readAsDataURL(f)}

  if(bState==='idle'){const n=upcoming()[0];if(n&&n.ts>Date.now()&&n.ts-Date.now()<36e5)b.classList.add('upcoming');else b.classList.remove('upcoming')}}

  b.onpointermove=e=>{if(pid!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)mv=true;if(mv)placeBubble(ox+dx,oy+dy)};

    const x=b.offsetLeft+state.size/2<innerWidth/2?6:innerWidth-state.size-6;b.classList.add('snap');placeBubble(x,b.offsetTop);state.pos={x,y:b.offsetTop};saveState()};

const PFX=`الساعة|الساعه|ساعة|at|à|a las|a la|um|saat|le`;
const TOM=/غدا[ًٌ]?|غد[ًٌ]ا|بكر[ةه]|tomorrow|demain|mañana|manana|yarın|yarin|morgen(?!s)/iu;
const UH=`ساعتين|ساعات|ساعة|hours?|hrs?|heures?|horas?|saat|stunden?`,UM=`دقيقتين|دقائق|دقيقة|minutes?|mins?|minutos?|dakika|dk|minuten`;
const REL=new RegExp(`(?<!\\p{L})(?:بعد|in|dans|en|über)\\s+(\\d+(?:[.,]\\d+)?)?\\s*(${UH}|${UM})(?!\\p{L})`,'iu');
const REL2=/(\d+)\s*(saat|dakika|dk)\s*sonra/iu;
const CMD=`remind me|remind|set|an?|the|alarm|appointment|reminder|to|for|me|please|rappelle-moi|rappelle|règle|rendez-vous|un|une|pour|moi|recuérdame|ponme|pon|una|cita|alarma|bana|hatırlat|ayarla|randevu|erinnere|mich|stelle|einen|termin|wecker|bitte|اضبط|ذكرني|ضع|اريد|أريد|لي|منبه|موعد|تذكير|في|عند|ب|de|la|el|le|à|at|um|saat|الساعة`;
const preRe=new RegExp(`((?<!\\p{L})${ALLC}\\s*)?((?<!\\p{L})(?:${PFX})\\s*)?$`,'iu');
const postRe=new RegExp(`^\\s*(?:(?:uhr|h|['’]?te|['’]?ta|['’]?de|de la)(?!\\p{L}))?\\s*(${ALLC})?`,'iu');
const pmTest=new RegExp(`^(?:${PMW})$`,'iu');
function parseUtterance(raw){
  let s=normalizeDigits(raw).replace(/de la ma[ñn]ana/gi,' am ').trim();
  const tom=TOM.test(s);s=s.replace(TOM,' ');let ts=null;const now=new Date();
  let m=REL.exec(s)||REL2.exec(s);
  if(m){const u=m[2],isH=new RegExp(`^(?:${UH})$`,'iu').test(u)||/^saat$/i.test(u);
    const n=parseFloat((m[1]||'').replace(',','.'))||(/ين$/.test(u)?2:1);ts=new Date(now.getTime()+n*(isH?36e5:6e4));ts.setSeconds(0,0);s=s.replace(m[0],' ')}
  else{
    const re=/(\d{1,2})(?:[:.h](\d{2}))?/g;let x;
    while((x=re.exec(s))){
      const idx=x.index,before=s.slice(Math.max(0,idx-16),idx),pm=before.match(preRe),post=s.slice(idx+x[0].length).match(postRe);
      const per=(pm&&pm[1]&&pm[1].trim())||(post&&post[1]);
      if(!(x[2]||(pm&&pm[2])||per))continue;
      let h=+x[1],mi=+(x[2]||0);if(h>23||mi>59)continue;
      const isPm=per&&pmTest.test(per.trim()),isAm=per&&!isPm;
      if(isPm&&h<12)h+=12;else if(isAm&&h===12)h=0;else if(!per&&h>=1&&h<=7)h+=12;
      const d=new Date(now);d.setHours(h,mi,0,0);if(tom)d.setDate(d.getDate()+1);else if(d<=now)d.setDate(d.getDate()+1);ts=d;
      const st=idx-(pm?pm[0].length:0),en=idx+x[0].length+(post?post[0].length:0);s=s.slice(0,st)+' '+s.slice(en);break;
    }
  }
  if(!ts)return null;
  const lead=new RegExp(`^[\\s,.،-]*(?:${CMD})(?!\\p{L})`,'iu'),trail=new RegExp(`(?<!\\p{L})(?:${CMD})[\\s,.،-]*$`,'iu');
  let title=s.replace(/\s+/g,' ').trim(),g=0;
  while(g++<8&&lead.test(title))title=title.replace(lead,'').trim();
  g=0;while(g++<4&&trail.test(title))title=title.replace(trail,'').trim();
  return{title:title.replace(/^[\s,.،-]+|[\s,.،-]+$/g,'')||t('dt'),ts:ts.getTime()};
}

/* ═══ التأكيد ═══ */
function showConfirm(title,ts){$('#cTitle').value=title;$('#cWhen').value=toLocalInput(ts);updSum();$('#confirm').classList.add('on')}
function updSum(){const v=new Date($('#cWhen').value).getTime();$('#cSum').textContent=isNaN(v)?'':`${fmtDay(v)} · ${fmtTime(v)}`}
function closeConfirm(){$('#confirm').classList.remove('on');if(bState==='processing')setBS('idle')}
function saveConfirmed(){const ts=new Date($('#cWhen').value).getTime();if(isNaN(ts)){toast(t('nu'));return}
  state.appts.push({id:'a'+Date.now(),title:$('#cTitle').value.trim()||t('dt'),ts,done:false});
  if(!saveState()){state.appts.pop();return}
  $('#confirm').classList.remove('on');setBS('success');setTimeout(()=>{setBS('idle');updateBubbleVisual()},1600);toast(t('ok'));hap(20);render();
  if('Notification'in window&&Notification.permission==='default')try{Notification.requestPermission()}catch(e){}}

/* ═══ التنبيه ═══ */
let ringing=null,toneTimer=null,vibTimer=null;
function startAlarmWatcher(){setInterval(checkAlarms,1000);document.addEventListener('visibilitychange',checkAlarms)}
function checkAlarms(){if(ringing)return;const now=Date.now(),a=state.appts.find(x=>!x.done&&x.ts<=now);if(a)triggerAlarm(a);else if(!(now%30)){updateBubbleVisual()}}
function triggerAlarm(a){ringing=a;$('#aT').textContent=a.title;$('#aTm').textContent=fmtTime(a.ts);$('#aSn').textContent=`${t('sn')} · ${state.snooze}${t('min')}`;
  $('#alarm').classList.add('on');closeVoice();$('#confirm').classList.remove('on');updateBubbleVisual();playAlarmLoop();vibrateLoop();
  if('Notification'in window&&Notification.permission==='granted')try{new Notification(`OZAK · ${t('now')}`,{body:`${a.title} — ${fmtTime(a.ts)}`,tag:a.id,requireInteraction:true})}catch(e){}}
function playAlarmLoop(){const play=()=>playTone(state.tone,true);play();if(!isCustom(state.tone))toneTimer=setInterval(play,3500)}
function vibrateLoop(){const go=()=>hap(VPAT[state.vib]);go();vibTimer=setInterval(go,3500)}
function stopAlarm(){clearInterval(toneTimer);clearInterval(vibTimer);stopCustom();hap(0);$('#alarm').classList.remove('on');ringing=null;updateBubbleVisual();render()}
function snoozeAlarm(){if(!ringing)return;ringing.ts=Date.now()+state.snooze*6e4;saveState();stopAlarm()}
function doneAlarm(){if(!ringing)return;ringing.done=true;saveState();stopAlarm()}

/* ═══ الصلاحيات ═══ */
const ob={'#o1':false,'#o2':false,'#o3':false};
function reqMic(){if(NATIVE){Android.requestMic();return}if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ob['#o1']=true;render();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(x=>x.stop());ob['#o1']=true;render()}).catch(()=>toast(t('o1')))}
function reqNotif(){if(NATIVE){Android.requestNotif();return}if(!('Notification'in window)){ob['#o2']=true;render();return}
  Notification.requestPermission().then(p=>{ob['#o2']=p==='granted';render()}).catch(()=>{})}

/* ═══ الأحداث ═══ */
function bind(){
  document.addEventListener('click',e=>{if(e.target.closest('button,.chip'))hap(8)});
  addEventListener('focus',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
  document.addEventListener('pointerdown',audioCtx,{once:true});
  $$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAppts()});
  $('#bubSw').onclick=toggleBubble;$('#addV').onclick=openVoice;
  $('#manual').onclick=()=>{const d=new Date(Date.now()+36e5);d.setMinutes(0,0,0);showConfirm('',d.getTime())};
  $('#list').onclick=e=>{const b=e.target.closest('[data-del]');if(!b)return;state.appts=state.appts.filter(a=>a.id!==b.dataset.del);saveState();toast(t('del'));render()};
  $('#vCan').onclick=closeVoice;$('#vGo').onclick=startListening;$('#cCan').onclick=closeConfirm;$('#cSave').onclick=saveConfirmed;$('#cWhen').oninput=updSum;
  $('#aSn').onclick=snoozeAlarm;$('#aDn').onclick=doneAlarm;
  $('#opR').oninput=e=>{setOpacity(e.target.value);$('#opV').textContent=e.target.value+'%'};$('#opR').onchange=saveState;
  $('#szR').oninput=e=>{setBubbleSize(e.target.value);$('#szV').textContent=e.target.value+'px'};$('#szR').onchange=saveState;
  $('#tones').onclick=$('#customs').onclick=e=>{const rm=e.target.closest('[data-rm]');
    if(rm){const id=rm.dataset.rm;state.custom=state.custom.filter(c=>c.id!==id);if(state.tone===id)state.tone='chime';saveState();buildToneGrid();buildCustomTones();return}
    const c=e.target.closest('[data-tone]');if(!c)return;state.tone=c.dataset.tone;saveState();buildToneGrid();buildCustomTones();playTone(state.tone,false)};
  $('#addM').onclick=()=>$('#file').click();$('#file').onchange=e=>{importMusic(e.target.files[0]);e.target.value=''};
  $('#rSn').onclick=()=>{state.snooze=SNOOZES[(SNOOZES.indexOf(state.snooze)+1)%SNOOZES.length];saveState();render()};
  $('#rVb').onclick=()=>{state.vib=VIBS[(VIBS.indexOf(state.vib)+1)%3];saveState();render();hap(VPAT[state.vib])};
  $('#langs').onclick=e=>{const b=e.target.closest('[data-lang]');if(!b)return;state.lang=b.dataset.lang;saveState();applyLanguage()};
  $('#o1').onclick=reqMic;$('#o2').onclick=reqNotif;$('#o3').onclick=()=>{if(NATIVE)Android.requestOverlay();else{ob['#o3']=true;render()}};
  $('#obGo').onclick=()=>{state.onboarded=true;saveState();go('home')};
}

/* ═══ التشغيل ═══ */
function init(){
  $$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic));
  bind();applyLanguage();initBubble();startAlarmWatcher();
  go(state.onboarded?'home':'ob');nativeSync();
  setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),550)},1800);
  setInterval(updateBubbleVisual,30000);
}
init();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

/* ═══════════════════════════════════════════════════════════════
   دليل التحويل إلى APK (Android Studio + WebView)
   ───────────────────────────────────────────────────────────────
   1) ضع هذا الملف في app/src/main/assets/ozak.html
   2) MainActivity.kt: WebView يحمّل file:///android_asset/ozak.html مع تفعيل
      JavaScript وDOM Storage وmediaPlaybackRequiresUserGesture=false، ويمنح
      الميكروفون عبر WebChromeClient.onPermissionRequest. يعرّف جسر JS
      (@JavascriptInterface) باسم Android: scheduleAlarm(id,title,ts)،
      cancelAlarm(id)، startBubble()، stopBubble()، openOverlaySettings().
      بما أن Web Speech غير مدعوم في WebView، استخدم SpeechRecognizer
      الأصلي وأعد النص إلى JS عبر evaluateJavascript.
   3) BubbleService.kt: Foreground Service (إشعار دائم) يرسم الفقاعة بـ
      WindowManager + TYPE_APPLICATION_OVERLAY (إذن SYSTEM_ALERT_WINDOW)،
      قابلة للسحب، وعند الضغط تفتح MainActivity بوضع الصوت.
   4) AlarmScheduler.kt: يستخدم AlarmManager.setExactAndAllowWhileIdle
      (إذن SCHEDULE_EXACT_ALARM / USE_EXACT_ALARM) مع PendingIntent لكل موعد.
   5) AlarmReceiver.kt: BroadcastReceiver يستقبل الموعد ويطلق AlarmActivity
      عبر Full-Screen Intent (إذن USE_FULL_SCREEN_INTENT) مع قناة إشعارات عالية الأهمية.
   6) AlarmActivity.kt: شاشة المنبه الأصلية (showWhenLocked + turnScreenOn)،
      تشغّل النغمة بـ MediaPlayer وتهتز بـ Vibrator، وزرّا «تم/تأجيل».
   7) BootReceiver.kt: يعيد جدولة المنبهات بعد إعادة تشغيل الجهاز
      (RECEIVE_BOOT_COMPLETED) من التخزين المحلي.
   8) AndroidManifest.xml: الأذونات RECORD_AUDIO وPOST_NOTIFICATIONS
      وVIBRATE وFOREGROUND_SERVICE وWAKE_LOCK مع تسجيل الخدمة والمستقبِلات.
   ═══════════════════════════════════════════════════════════════ */
</script>
